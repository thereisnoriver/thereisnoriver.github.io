<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img"><title>Batch processing and encryption deadline</title><rect width="1000" height="450" fill="#fff"/><text x="45" y="53" font-family='Arial,Helvetica,sans-serif' font-size="30" font-weight="700" fill="#183750">Batch Processing Workflow</text><text x="45" y="90" font-family='Arial,Helvetica,sans-serif' font-size="18" fill="#536779">A time-based encryption policy can change file availability during processing.</text><g font-family='Arial,Helvetica,sans-serif' text-anchor="middle" font-size="21" fill="#254863"><rect x="35" y="163" width="190" height="92" rx="12" fill="#ecf4fa" stroke="#90b0c7" stroke-width="2"/><text x="130" y="217">File Received</text><rect x="282" y="163" width="190" height="92" rx="12" fill="#ecf4fa" stroke="#90b0c7" stroke-width="2"/><text x="377" y="217">Validation</text><rect x="529" y="163" width="190" height="92" rx="12" fill="#ecf4fa" stroke="#90b0c7" stroke-width="2"/><text x="624" y="217">Processing</text><rect x="776" y="163" width="190" height="92" rx="12" fill="#ecf4fa" stroke="#90b0c7" stroke-width="2"/><text x="871" y="217">Settlement</text></g><g stroke="#4e7189" stroke-width="3" fill="none"><path d="M225 209 H278 M270 201 L278 209 L270 217"/><path d="M472 209 H525 M517 201 L525 209 L517 217"/><path d="M719 209 H772 M764 201 L772 209 L764 217"/></g><line x1="500" y1="275" x2="500" y2="327" stroke="#be5a43" stroke-width="3" stroke-dasharray="6 6"/><rect x="290" y="327" width="420" height="74" rx="12" fill="#fff4ef" stroke="#da9b86"/><text x="500" y="355" font-family='Arial,Helvetica,sans-serif' font-size="19" font-weight="700" text-anchor="middle" fill="#9a3b26">Encryption deadline</text><text x="500" y="382" font-family='Arial,Helvetica,sans-serif' font-size="16" text-anchor="middle" fill="#783a2a">A delayed job may lose plaintext access</text></svg>
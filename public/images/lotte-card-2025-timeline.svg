<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 950" role="img" aria-labelledby="t d"><title id="t">2025 Lotte Card Data Breach Timeline</title><desc id="d">Chronology of public announcements in August and September 2025</desc><rect width="960" height="950" fill="#f8fafc"/><rect x="40" y="36" width="880" height="874" rx="24" fill="#fff" stroke="#dbe3ec"/><text x="86" y="99" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#132c48">The 2025 Lotte Card Data Breach</text><text x="86" y="138" font-family="Arial,sans-serif" font-size="19" fill="#607287">Publicly reported incident timeline</text><line x1="116" y1="206" x2="116" y2="749" stroke="#cbd5e1" stroke-width="5"/><g font-family="Arial,sans-serif"><circle cx="116" cy="222" r="12" fill="#bb4659"/><text x="158" y="211" font-size="21" font-weight="700" fill="#203951">Aug 14–27, 2025</text><text x="158" y="244" font-size="20" fill="#3a4c60">Payment application server breached; web shell installed.</text><text x="158" y="272" font-size="20" fill="#3a4c60">Data exfiltration took place over multiple days.</text><circle cx="116" cy="347" r="12" fill="#28618a"/><text x="158" y="337" font-size="21" font-weight="700" fill="#203951">Sep 1, 2025</text><text x="158" y="370" font-size="20" fill="#3a4c60">Incident reported to financial regulators;</text><text x="158" y="398" font-size="20" fill="#3a4c60">initially reported data volume: ~1.7 GB.</text><circle cx="116" cy="471" r="12" fill="#28618a"/><text x="158" y="460" font-size="21" font-weight="700" fill="#203951">Sep 2, 2025</text><text x="158" y="493" font-size="20" fill="#3a4c60">Financial authorities began on-site investigation.</text><circle cx="116" cy="573" r="12" fill="#28618a"/><text x="158" y="562" font-size="21" font-weight="700" fill="#203951">Sep 3, 2025</text><text x="158" y="595" font-size="20" fill="#3a4c60">KISA warned about Oracle WebLogic</text><text x="158" y="623" font-size="20" fill="#3a4c60">CVE-2017-10271, a known RCE vulnerability.</text><circle cx="116" cy="695" r="12" fill="#bb4659"/><text x="158" y="683" font-size="21" font-weight="700" fill="#203951">Sep 18, 2025</text><text x="158" y="716" font-size="20" fill="#3a4c60">FSC disclosed ~200 GB exfiltrated and</text><text x="158" y="744" font-size="20" fill="#3a4c60">2.969 million affected customers.</text></g><rect x="85" y="789" width="790" height="66" rx="12" fill="#eff5fa"/><text x="105" y="817" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#203951">Confirmed vs. inferred</text><text x="105" y="842" font-family="Arial,sans-serif" font-size="16" fill="#485b70">Web shell installation: confirmed. Exact initial exploit path: not established here.</text><text x="86" y="888" font-family="Arial,sans-serif" font-size="15" fill="#64748b">Sources: FSC (Sep 18, 2025); KISA (Sep 3, 2025)</text></svg>